name: hive-mediawiki-fpm

on:
  push:
    tags:
      - "hive-mediawiki-[0-9]+.[0-9]+.[0-9]+-[0-9]+-fpm"

jobs:
  build:
    name: Build and push hive-mediawiki-fpm
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/mediawiki-fpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Collect Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gbenson/mediawiki-fpm
          tags: |
            type=match,pattern=hive-mediawiki-(\d+\.\d+\.\d+-\d+),group=1
            type=match,pattern=hive-mediawiki-(\d+\.\d+\.\d+),group=1
            type=match,pattern=hive-mediawiki-(\d+\.\d+),group=1

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: services/mediawiki-fpm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_SERVER_URL=${{ github.server_url }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ github.sha }}
